<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iron Gambit Command</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Jost:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --obsidian:#0A0908; --line:rgba(216,182,120,.14);
  --burgundy:#5E1D25; --sandstone:#B9A488; --cream:#F2EBDD;
  --gold:#D8B678; --gold-hi:#F0DAA8; --gold-dp:#9C7C43; --smoke:#8B8078;
  --serif:'Cormorant Garamond',Georgia,serif; --sans:'Jost',system-ui,sans-serif; --mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--obsidian);color:var(--cream);font-family:var(--sans);font-weight:300;overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:none}
:focus-visible{outline:1px solid var(--gold);outline-offset:2px}

.bar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:0 18px;height:58px;
  border-bottom:1px solid var(--line);background:rgba(10,9,8,.92);backdrop-filter:blur(14px);position:sticky;top:0;z-index:60}
.logo{display:flex;align-items:center;gap:10px}
.logo svg{width:26px;height:26px;color:var(--gold)}
.logo b{font-family:var(--serif);font-weight:600;font-size:15px;letter-spacing:.18em;text-transform:uppercase}
.logo em{font-style:normal;font-size:8.5px;letter-spacing:.26em;color:var(--gold-dp);text-transform:uppercase;display:block}
.bar-r{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--smoke)}
.chip{border:1px solid var(--line);padding:6px 10px;transition:all .25s;white-space:nowrap}
.chip:hover{border-color:var(--gold-dp);color:var(--gold)}
.chip.on{border-color:var(--gold);color:var(--gold)}
.live{display:flex;align-items:center;gap:6px;color:var(--gold)}
.pip{width:6px;height:6px;border-radius:50%;background:#6FBF73;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
@media(max-width:760px){.logo em{display:none}.bar{padding:0 10px}.chip{padding:5px 7px;font-size:9px}}

.shell{display:grid;grid-template-columns:228px 1fr 252px;gap:1px;background:var(--line)}
@media(max-width:1180px){.shell{grid-template-columns:1fr}}
.col{background:var(--obsidian);padding:16px}
.stage{background:#090C10;position:relative;overflow:hidden;min-height:520px;touch-action:none;cursor:grab}
.stage.drag{cursor:grabbing}
.hint{position:absolute;bottom:10px;left:12px;font-family:var(--mono);font-size:9px;letter-spacing:.12em;
  color:rgba(216,182,120,.42);pointer-events:none;z-index:5}

.h{font-size:9px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold-dp);margin-bottom:13px}
.ag{display:flex;align-items:center;gap:10px;padding:9px 8px;border:1px solid transparent;margin-bottom:2px;
  cursor:pointer;transition:all .22s;text-align:left;width:100%}
.ag:hover{background:rgba(216,182,120,.05);border-color:var(--line)}
.ag.sel{background:rgba(216,182,120,.09);border-color:var(--gold-dp)}
.av{width:22px;height:22px;flex:none}
.ag-t{flex:1;min-width:0}
.ag-n{font-size:12px;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ag-z{font-family:var(--mono);font-size:8px;letter-spacing:.07em;color:var(--smoke);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ag-d{width:5px;height:5px;border-radius:50%;flex:none}
.d-work{background:#6FBF73}.d-move{background:var(--gold)}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);margin-top:20px}
.st{background:var(--obsidian);padding:12px 10px}
.st b{font-family:var(--serif);font-size:24px;font-weight:500;color:var(--gold);display:block;line-height:1}
.st span{font-size:8px;letter-spacing:.18em;text-transform:uppercase;color:var(--smoke);margin-top:4px;display:block}

.det-n{font-family:var(--serif);font-size:22px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-top:10px}
.det-r{font-size:11px;color:var(--smoke);line-height:1.7;margin-top:10px}
.det-k{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9.5px;padding:8px 0;
  border-bottom:1px solid var(--line);letter-spacing:.04em}
.det-k span:first-child{color:var(--smoke)}.det-k span:last-child{color:var(--gold)}
.lg{display:flex;align-items:center;gap:8px;font-size:10.5px;padding:5px 0;color:var(--smoke)}
.sw{width:10px;height:10px;flex:none}

.log{border-top:1px solid var(--line);background:var(--obsidian);padding:12px 18px 18px;max-height:172px;overflow-y:auto}
.log::-webkit-scrollbar{width:4px}.log::-webkit-scrollbar-thumb{background:var(--gold-dp)}
.ln{font-family:var(--mono);font-size:10px;padding:3px 0;display:flex;gap:10px;animation:sl .45s ease;line-height:1.5}
@keyframes sl{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
.ln-t{color:#57514A;flex:none}
.ln-a{color:var(--gold);flex:none;width:118px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ln-m{color:#948C82}
.ln.hi .ln-m{color:var(--cream)}
@media(max-width:640px){.ln-a{width:74px}.ln{font-size:9px;gap:6px}}

svg.world{display:block;width:100%;height:auto}
.bldg{cursor:pointer}
.bldg:hover .hit{fill:rgba(216,182,120,.12)}
.blabel{font-family:var(--sans);font-size:10px;letter-spacing:.2em;text-transform:uppercase;fill:#F0DAA8;
  paint-order:stroke;stroke:rgba(6,8,11,.92);stroke-width:4px;pointer-events:none;text-anchor:middle}
.aname{font-family:var(--mono);font-size:7.5px;letter-spacing:.05em;fill:#E7D3A8;text-anchor:middle;pointer-events:none;
  paint-order:stroke;stroke:rgba(6,8,11,.85);stroke-width:3px}
.ring{fill:none;stroke:#F0DAA8;stroke-width:1.6;opacity:0}
.ring.on{opacity:.9}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<symbol id="crest" viewBox="0 0 120 120">
  <circle cx="60" cy="60" r="43" fill="none" stroke="currentColor" stroke-width="2.6"/>
  <rect x="10" y="57.5" width="100" height="5" fill="currentColor"/>
  <rect x="20" y="47" width="7" height="26" rx="1.4" fill="currentColor"/><rect x="29" y="50" width="6" height="20" rx="1.4" fill="currentColor"/>
  <rect x="93" y="47" width="7" height="26" rx="1.4" fill="currentColor"/><rect x="85" y="50" width="6" height="20" rx="1.4" fill="currentColor"/>
  <rect x="6" y="54" width="5" height="12" rx="1.2" fill="currentColor"/><rect x="109" y="54" width="5" height="12" rx="1.2" fill="currentColor"/>
  <rect x="57.6" y="18" width="4.8" height="15" fill="currentColor"/><rect x="53" y="23" width="14" height="4.6" fill="currentColor"/>
  <path d="M46 40 L49.5 32 L54 38 L60 30 L66 38 L70.5 32 L74 40 Z" fill="currentColor"/>
  <rect x="45" y="40" width="30" height="6" rx="1" fill="currentColor"/>
  <path d="M49 47 C49 62 45 72 43 84 L77 84 C75 72 71 62 71 47 Z" fill="currentColor"/>
  <rect x="39" y="85" width="42" height="7" rx="1.6" fill="currentColor"/><rect x="35" y="93" width="50" height="8" rx="2" fill="currentColor"/>
</symbol>
</svg>

<header class="bar">
  <a href="index.html" class="logo"><svg viewBox="0 0 120 120"><use href="#crest"/></svg>
    <div><b>Iron Gambit</b><em>Command</em></div></a>
  <div class="bar-r">
    <span class="live"><span class="pip"></span><span id="clk">--:--</span></span>
    <button class="chip on" id="btnRun">Running</button>
    <button class="chip" id="btnSpd">1&times;</button>
    <button class="chip" id="btnFit">Reset view</button>
  </div>
</header>

<div class="shell">
  <aside class="col">
    <div class="h">The Crew</div>
    <div id="roster"></div>
    <div class="stats">
      <div class="st"><b id="sActive">0</b><span>Working</span></div>
      <div class="st"><b id="sTasks">0</b><span>Tasks today</span></div>
      <div class="st"><b id="sHand">0</b><span>Handoffs</span></div>
      <div class="st"><b id="sPop">0</b><span>On street</span></div>
    </div>
  </aside>

  <main class="stage" id="stage">
    <svg class="world" id="world" viewBox="0 0 1600 1000" role="img" aria-label="Isometric city map of the Iron Gambit operation."></svg>
    <div class="hint">Drag to pan &nbsp;·&nbsp; scroll to zoom &nbsp;·&nbsp; click a person or a building</div>
  </main>

  <aside class="col">
    <div class="h">Dossier</div>
    <div id="detail"></div>
    <div class="h" style="margin-top:24px">The Board</div>
    <div class="lg"><span class="sw" style="background:#7A2731"></span>The Iron House</div>
    <div class="lg"><span class="sw" style="background:#3A3630"></span>The Office</div>
    <div class="lg"><span class="sw" style="background:#2E3A44"></span>The Press</div>
    <div class="lg"><span class="sw" style="background:#B9A488"></span>The Market</div>
    <div class="lg"><span class="sw" style="background:#8D7A60"></span>The Row</div>
    <div class="lg"><span class="sw" style="background:#4A1620"></span>Whiskey River</div>
  </aside>
</div>

<div class="log" id="log"></div>

<script>
(function(){
"use strict";
var NS='http://www.w3.org/2000/svg';
var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var world=document.getElementById('world'), stage=document.getElementById('stage');

/* ============ iso helpers ============ */
var TW=48, TH=24, OX=800, OY=250, N=26;
function px(x,y){ return OX+(x-y)*TW/2; }
function py(x,y){ return OY+(x+y)*TH/2; }
function el(t,a){ var e=document.createElementNS(NS,t); for(var k in a) e.setAttribute(k,a[k]); return e; }
function poly(pts,fill,extra){
  var o={points:pts.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1);}).join(' '),fill:fill};
  if(extra) for(var k in extra) o[k]=extra[k];
  return el('polygon',o);
}
function shade(hex,f){
  var n=parseInt(hex.slice(1),16),r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  r=Math.max(0,Math.min(255,Math.round(r*f)));g=Math.max(0,Math.min(255,Math.round(g*f)));b=Math.max(0,Math.min(255,Math.round(b*f)));
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}

/* ============ defs ============ */
var defs=el('defs',{});
defs.innerHTML=
 '<linearGradient id="vs" x1="0" y1="0" x2="0" y2="1">'+
 '<stop offset="0" stop-color="#fff" stop-opacity=".10"/><stop offset=".55" stop-color="#000" stop-opacity="0"/>'+
 '<stop offset="1" stop-color="#000" stop-opacity=".45"/></linearGradient>'+
 '<linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">'+
 '<stop offset="0" stop-color="#9FC4D8" stop-opacity=".45"/><stop offset=".45" stop-color="#243642" stop-opacity=".88"/>'+
 '<stop offset="1" stop-color="#8FB3C8" stop-opacity=".32"/></linearGradient>'+
 '<radialGradient id="lampG"><stop offset="0" stop-color="#FFD98A" stop-opacity=".6"/>'+
 '<stop offset="1" stop-color="#FFD98A" stop-opacity="0"/></radialGradient>'+
 '<radialGradient id="neonG"><stop offset="0" stop-color="#FF5C7A" stop-opacity=".65"/>'+
 '<stop offset="1" stop-color="#FF5C7A" stop-opacity="0"/></radialGradient>'+
 '<filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>';
world.appendChild(defs);

var cam=el('g',{}); world.appendChild(cam);
var L={};
['ground','shadow','flat','bldg','props','link','chars','fx'].forEach(function(k){ L[k]=el('g',{}); cam.appendChild(L[k]); });

/* ============ streets ============ */
function isRoad(x,y){ return (x>=8&&x<=9)||(x>=17&&x<=18)||(y>=8&&y<=9)||(y>=17&&y<=18); }
function isPlaza(x,y){ return x>=11&&x<=15&&y>=11&&y<=15; }
for(var gx0=0;gx0<N;gx0++){ for(var gy0=0;gy0<N;gy0++){
  var f;
  if(isRoad(gx0,gy0)) f='#191C1F';
  else if(isPlaza(gx0,gy0)) f=(((gx0+gy0)%2===0)?'#231E18':'#14110E');
  else f=(((gx0*7+gy0*13)%5===0)?'#131610':'#10130C');
  L.ground.appendChild(poly([[px(gx0,gy0),py(gx0,gy0)],[px(gx0+1,gy0),py(gx0+1,gy0)],
    [px(gx0+1,gy0+1),py(gx0+1,gy0+1)],[px(gx0,gy0+1),py(gx0,gy0+1)]],f,
    {stroke:isPlaza(gx0,gy0)?'rgba(216,182,120,.10)':'rgba(255,255,255,.018)','stroke-width':'1'}));
}}
function lanes(ax,ay,bx,by){
  var steps=Math.round(Math.max(Math.abs(bx-ax),Math.abs(by-ay))*2);
  for(var i=0;i<steps;i+=2){
    var t0=i/steps,t1=(i+1)/steps;
    L.flat.appendChild(el('line',{x1:px(ax+(bx-ax)*t0,ay+(by-ay)*t0),y1:py(ax+(bx-ax)*t0,ay+(by-ay)*t0),
      x2:px(ax+(bx-ax)*t1,ay+(by-ay)*t1),y2:py(ax+(bx-ax)*t1,ay+(by-ay)*t1),
      stroke:'rgba(216,182,120,.26)','stroke-width':'1.6','stroke-linecap':'round'}));
  }
}
lanes(9,0,9,26); lanes(18,0,18,26); lanes(0,9,26,9); lanes(0,18,26,18);

/* ============ building kit ============ */
var winCache=[], lampGlows=[], neonEls=[];

function contactShadow(x,y,w,d,h){
  var o=h*0.15;
  L.shadow.appendChild(poly([[px(x,y)+o,py(x,y)+o*.5],[px(x+w,y)+o,py(x+w,y)+o*.5],
    [px(x+w,y+d)+o,py(x+w,y+d)+o*.5],[px(x,y+d)+o,py(x,y+d)+o*.5]],'rgba(0,0,0,.55)',{filter:'url(#soft)'}));
}
function box(g,x,y,w,d,h,base,lift){
  lift=lift||0;
  var A=[px(x,y),py(x,y)-h-lift],B=[px(x+w,y),py(x+w,y)-h-lift],
      C=[px(x+w,y+d),py(x+w,y+d)-h-lift],D=[px(x,y+d),py(x,y+d)-h-lift];
  var Bg=[px(x+w,y),py(x+w,y)-lift],Cg=[px(x+w,y+d),py(x+w,y+d)-lift],Dg=[px(x,y+d),py(x,y+d)-lift];
  g.appendChild(poly([B,C,Cg,Bg],shade(base,.5)));
  g.appendChild(poly([B,C,Cg,Bg],'url(#vs)'));
  g.appendChild(poly([D,C,Cg,Dg],shade(base,.78)));
  g.appendChild(poly([D,C,Cg,Dg],'url(#vs)'));
  g.appendChild(poly([A,B,C,D],shade(base,1.15)));
  g.appendChild(el('line',{x1:D[0],y1:D[1],x2:C[0],y2:C[1],stroke:'rgba(255,240,210,.30)','stroke-width':'1.3'}));
  g.appendChild(el('line',{x1:B[0],y1:B[1],x2:C[0],y2:C[1],stroke:'rgba(255,240,210,.17)','stroke-width':'1.3'}));
  g.appendChild(el('line',{x1:C[0],y1:C[1],x2:Cg[0],y2:Cg[1],stroke:'rgba(255,240,210,.12)','stroke-width':'1.2'}));
  return {A:A,B:B,C:C,D:D,Bg:Bg,Cg:Cg,Dg:Dg};
}
function windows(g,x,y,w,d,h,floors,glass){
  floors=floors||Math.max(1,Math.floor((h-16)/28));
  function wall(p0,p1,cols,seed){
    for(var f=0;f<floors;f++){
      var yy=h-18-f*28; if(yy<6) continue;
      for(var c=0;c<cols;c++){
        var u0=(c+.22)/cols,u1=(c+.78)/cols;
        var ax=p0[0]+(p1[0]-p0[0])*u0, ay=p0[1]+(p1[1]-p0[1])*u0;
        var bx=p0[0]+(p1[0]-p0[0])*u1, by=p0[1]+(p1[1]-p0[1])*u1;
        var lit=((c*3+f*5+seed)%4)!==0;
        var wn=poly([[ax,ay-yy-14],[bx,by-yy-14],[bx,by-yy],[ax,ay-yy]],
          glass?'url(#glass)':'#D8B678',{opacity:glass?.9:(lit?.28:.06)});
        g.appendChild(wn);
        winCache.push({e:wn,b:glass?.9:(lit?.28:.06),v:glass?.16:(lit?1:.3)});
      }
    }
  }
  var Dg=[px(x,y+d),py(x,y+d)],Cg=[px(x+w,y+d),py(x+w,y+d)],Bg=[px(x+w,y),py(x+w,y)];
  var s=Math.floor(x*3+y*7);
  wall(Dg,Cg,Math.max(1,Math.round(w*1.1)),s);
  wall(Cg,Bg,Math.max(1,Math.round(d*1.1)),s+2);
}
function roofKit(g,x,y,w,d,h,base){
  var i=.3;
  var A=[px(x+i,y+i),py(x+i,y+i)-h-5],B=[px(x+w-i,y+i),py(x+w-i,y+i)-h-5],
      C=[px(x+w-i,y+d-i),py(x+w-i,y+d-i)-h-5],D=[px(x+i,y+d-i),py(x+i,y+d-i)-h-5];
  g.appendChild(poly([A,B,C,D],'none',{stroke:shade(base,1.35),'stroke-width':'3','stroke-linejoin':'round'}));
  var n=Math.max(1,Math.floor(w*d/7));
  for(var k=0;k<n;k++){
    var ux=x+.9+((k*2.3)%Math.max(.8,w-2)),uy=y+.8+((k*1.7)%Math.max(.8,d-2));
    box(g,ux,uy,.9,.8,9,'#575C60',h);
    g.appendChild(el('circle',{cx:px(ux+.45,uy+.4),cy:py(ux+.45,uy+.4)-h-9,r:3.2,fill:'#3A3F43',
      stroke:'rgba(255,255,255,.15)','stroke-width':'1'}));
  }
  g.appendChild(poly([[px(x+w-1.3,y+.6),py(x+w-1.3,y+.6)-h-1],[px(x+w-.6,y+.6),py(x+w-.6,y+.6)-h-1],
    [px(x+w-.6,y+d-.6),py(x+w-.6,y+d-.6)-h-1],[px(x+w-1.3,y+d-.6),py(x+w-1.3,y+d-.6)-h-1]],'#7FA9C0',{opacity:.32}));
}
function pitched(g,x,y,w,d,h,base,roofC){
  box(g,x,y,w,d,h,base);
  var rh=h+17, mid=y+d/2;
  var R1=[px(x,mid),py(x,mid)-rh],R2=[px(x+w,mid),py(x+w,mid)-rh];
  var A=[px(x,y),py(x,y)-h],B=[px(x+w,y),py(x+w,y)-h],
      C=[px(x+w,y+d),py(x+w,y+d)-h],D=[px(x,y+d),py(x,y+d)-h];
  g.appendChild(poly([D,C,R2,R1],shade(roofC,.98)));
  g.appendChild(poly([D,C,R2,R1],'url(#vs)'));
  g.appendChild(poly([A,B,R2,R1],shade(roofC,.6)));
  g.appendChild(poly([A,D,R1],shade(base,.92)));
  g.appendChild(poly([B,C,R2],shade(base,.64)));
  g.appendChild(el('line',{x1:R1[0],y1:R1[1],x2:R2[0],y2:R2[1],stroke:'rgba(255,240,210,.34)','stroke-width':'1.6'}));
  box(g,x+w-.75,y+.4,.5,.5,15,'#4A3B33',h+4);
  var dg=[px(x,y+d),py(x,y+d)],cg=[px(x+w,y+d),py(x+w,y+d)];
  var dx=dg[0]+(cg[0]-dg[0])*.52, dy=dg[1]+(cg[1]-dg[1])*.52;
  g.appendChild(poly([[dx-5,dy-19],[dx+5,dy-14],[dx+5,dy-1],[dx-5,dy-6]],'#3A2C22'));
  g.appendChild(el('circle',{cx:dx+3.4,cy:dy-8.4,r:.9,fill:'#D8B678'}));
  var wx=dg[0]+(cg[0]-dg[0])*.17, wy=dg[1]+(cg[1]-dg[1])*.17;
  var wn=poly([[wx-5,wy-24],[wx+5,wy-19],[wx+5,wy-9],[wx-5,wy-14]],'#D8B678',{opacity:.24});
  g.appendChild(wn); winCache.push({e:wn,b:.24,v:1});
}
function tree(gx,gy,s){
  s=s||1; var bx=px(gx,gy),by=py(gx,gy), g=el('g',{});
  g.appendChild(el('ellipse',{cx:bx+4,cy:by+2,rx:11*s,ry:5*s,fill:'rgba(0,0,0,.42)',filter:'url(#soft)'}));
  g.appendChild(el('rect',{x:bx-2*s,y:by-16*s,width:4*s,height:17*s,fill:'#3B2E22',rx:1.4}));

  var l=document.createElement('div'); l.className='ln'+(hi?' hi':'');
  l.innerHTML='<span class="ln-t">'+clock()+'</span><span class="ln-a"></span><span class="ln-m"></span>';
  l.querySelector('.ln-a').textContent=who; l.querySelector('.ln-m').textContent=msg;
  logEl.insertBefore(l,logEl.firstChild);
  if(++lines>40){ logEl.removeChild(logEl.lastChild); lines--; }
}

/* ============ camera ============ */
var camX=0,camY=0,camZ=1;
function applyCam(){ cam.setAttribute('transform','translate('+camX.toFixed(1)+','+camY.toFixed(1)+') scale('+camZ.toFixed(3)+')'); }
function fit(){ camX=0;camY=0;camZ=1;applyCam(); }
fit();
var drag=false,lx0=0,ly0=0;
stage.addEventListener('pointerdown',function(e){ drag=true;lx0=e.clientX;ly0=e.clientY;stage.classList.add('drag');
  try{ stage.setPointerCapture(e.pointerId); }catch(err){} });
stage.addEventListener('pointermove',function(e){
  if(!drag) return;
  var r=world.getBoundingClientRect(), k=1600/r.width;
  camX+=(e.clientX-lx0)*k; camY+=(e.clientY-ly0)*k; lx0=e.clientX; ly0=e.clientY; applyCam();
});
['pointerup','pointercancel','pointerleave'].forEach(function(ev){
  stage.addEventListener(ev,function(){ drag=false; stage.classList.remove('drag'); });
});
stage.addEventListener('wheel',function(e){
  e.preventDefault();
  var nz=Math.max(.5,Math.min(3.2,camZ*(e.deltaY<0?1.12:1/1.12)));
  var r=world.getBoundingClientRect(), k=1600/r.width;
  var mx=(e.clientX-r.left)*k, my=(e.clientY-r.top)*k;
  camX=mx-(mx-camX)*(nz/camZ); camY=my-(my-camY)*(nz/camZ); camZ=nz; applyCam();
},{passive:false});
document.getElementById('btnFit').addEventListener('click',fit);

/* ============ sim ============ */
var running=true,speed=1,tasksToday=0,handoffs=0,last=performance.now();
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function chooseZone(a){
  if(Math.random()<.42) return a.home;
  if(a.id==='guard') return pick(ZKEYS);
  if((TOD>.80||TOD<.08)&&Math.random()<.5) return 'whiskey';
  return pick(ZKEYS);
}
function place(p,gx,gy,walking,ph,flip){
  p.g.setAttribute('transform','translate('+px(gx,gy).toFixed(1)+','+py(gx,gy).toFixed(1)+')');
  if(walking){
    var s=Math.sin(ph*7)*22;
    p.l1.setAttribute('transform','rotate('+s.toFixed(1)+',-2.9,-14)');
    p.l2.setAttribute('transform','rotate('+(-s).toFixed(1)+',2.9,-14)');
    p.a1.setAttribute('transform','rotate('+(-s*.7).toFixed(1)+',-8.3,-30)');
    p.a2.setAttribute('transform','rotate('+(s*.7).toFixed(1)+',8.3,-30)');
    p.body.setAttribute('transform','translate(0,'+(Math.abs(Math.sin(ph*7))*-1.4).toFixed(2)+')');
  }else{
    p.l1.removeAttribute('transform'); p.l2.removeAttribute('transform');
    p.a1.removeAttribute('transform'); p.a2.removeAttribute('transform');
    p.body.setAttribute('transform','translate(0,'+(Math.sin(ph*1.6)*.5).toFixed(2)+')');
  }
}

function step(dt){
  TOD=(TOD+dt/300)%1;
  document.getElementById('clk').textContent='HOU '+clock();

  var night=Math.max(0,Math.sin((TOD-0.48)*Math.PI));
  world.style.background='rgb('+Math.round(9+night*3)+','+Math.round(13-night*4)+','+Math.round(17+night*10)+')';
  L.ground.setAttribute('opacity',(1-night*.2).toFixed(2));
  for(var w=0;w<winCache.length;w++){
    var wc=winCache[w];
    wc.e.setAttribute('opacity',Math.min(1,wc.b+night*wc.v*.7).toFixed(3));
  }
  lampGlows.forEach(function(g){ g.setAttribute('opacity',(night*.9).toFixed(2)); });
  neonEls.forEach(function(nn){ nn.setAttribute('opacity',(.18+night*.82).toFixed(2)); });

  AGENTS.forEach(function(a){
    a.ph+=dt;
    if(a.state==='move'){
      a.t+=dt/a.dur;
      if(a.t>=1){
        a.t=1;a.state='work';a.gx=a.tx;a.gy=a.ty;
        a.wait=5+Math.random()*10;a.task=pick(a.tasks);a.done++;tasksToday++;
        log(a.name,a.task,a.id===selected);
      }else{
        var e=a.t<.5?2*a.t*a.t:-1+(4-2*a.t)*a.t;
        a.gx=a.sx+(a.tx-a.sx)*e; a.gy=a.sy+(a.ty-a.sy)*e;
      }
    }else{
      a.wait-=dt;
      if(a.wait<=0){
        var zk=chooseZone(a);
        if(zk===a.zone){ a.wait=6+Math.random()*8;a.task=pick(a.tasks);a.done++;tasksToday++;log(a.name,a.task,a.id===selected); }
        else{
          var z=ZONES[zk];
          a.sx=a.gx;a.sy=a.gy;
          a.tx=z.at[0]+(Math.random()-.5)*1.4; a.ty=z.at[1]+(Math.random()-.5)*1.4;
          a.zone=zk;a.state='move';a.t=0;a.dur=5+Math.random()*4;
          a.flip=((a.tx-a.sx)-(a.ty-a.sy))<0;
          log(a.name,'walking to '+z.name.toLowerCase(),a.id===selected);
        }
      }
    }
    var moving=a.state==='move';
    place(a.p,a.gx,a.gy,moving,a.ph,moving&&a.flip);
    var rz=document.getElementById('rz_'+a.id); if(rz) rz.textContent=(moving?'\u2192 ':'')+ZONES[a.zone].name;
    var rd=document.getElementById('rd_'+a.id); if(rd) rd.className='ag-d '+(moving?'d-move':'d-work');
  });

  NPCS.forEach(function(n){
    n.ph+=dt; n.t+=dt/n.dur;
    if(n.t>=1){ n.sx=n.tx;n.sy=n.ty;n.tx=Math.random()*26;n.ty=(Math.random()<.5?8.4:17.5)+Math.random()*.7;n.t=0;n.dur=10+Math.random()*12; }
    n.gx=n.sx+(n.tx-n.sx)*n.t; n.gy=n.sy+(n.ty-n.sy)*n.t;
    place(n.p,n.gx,n.gy,true,n.ph,((n.tx-n.sx)-(n.ty-n.sy))<0);
  });

  TRAFFIC.forEach(function(t){
    if(t.axis==='x'){ t.gx+=t.dir*dt*t.spd*1.9; if(t.gx>27)t.gx=-1; if(t.gx<-1)t.gx=27; }
    else{ t.gy+=t.dir*dt*t.spd*1.9; if(t.gy>27)t.gy=-1; if(t.gy<-1)t.gy=27; }
    t.g.setAttribute('transform','translate('+px(t.gx,t.gy).toFixed(1)+','+py(t.gx,t.gy).toFixed(1)+')');
  });

  var movers=[];
  AGENTS.forEach(function(a){ movers.push({d:a.gx+a.gy,g:a.p.g}); });
  NPCS.forEach(function(n){ movers.push({d:n.gx+n.gy,g:n.p.g}); });
  TRAFFIC.forEach(function(t){ movers.push({d:t.gx+t.gy,g:t.g}); });
  movers.sort(function(p,q){ return p.d-q.d; });
  movers.forEach(function(m){ L.chars.appendChild(m.g); });

  while(L.link.firstChild) L.link.removeChild(L.link.firstChild);
  for(var i2=0;i2<AGENTS.length;i2++) for(var j2=i2+1;j2<AGENTS.length;j2++){
    var p1=AGENTS[i2],q1=AGENTS[j2],dx=p1.gx-q1.gx,dy=p1.gy-q1.gy;
    if(dx*dx+dy*dy<3.2&&p1.state==='work'&&q1.state==='work'){
      L.link.appendChild(el('line',{x1:px(p1.gx,p1.gy),y1:py(p1.gx,p1.gy)-22,x2:px(q1.gx,q1.gy),y2:py(q1.gx,q1.gy)-22,
        stroke:'rgba(216,182,120,.4)','stroke-width':'1','stroke-dasharray':'3 4'}));
      if(Math.random()<dt*.08){
        handoffs++;
        log(p1.name+' \u2194 '+q1.name.split(' ')[0],pick(['handoff at '+ZONES[p1.zone].name.toLowerCase(),
          'reviewing the same asset','flagged for a second read','agreed: push it to Friday','swapping notes on Drop 01']),true);
      }
    }
  }

  document.getElementById('sActive').textContent=AGENTS.filter(function(a){return a.state==='work';}).length;
  document.getElementById('sTasks').textContent=tasksToday;
  document.getElementById('sHand').textContent=handoffs;
  document.getElementById('sPop').textContent=AGENTS.length+NPCS.length;
  var s=AGENTS.filter(function(x){return x.id===selected;})[0];
  if(s){
    var dl=document.getElementById('dLoc'),ds=document.getElementById('dSt'),dd=document.getElementById('dDn');
    if(dl)dl.textContent=ZONES[s.zone].name;
    if(ds)ds.textContent=(s.state==='move'?'In transit':'Working');
    if(dd)dd.textContent=s.done;
  }
}

function loop(now){
  var dt=Math.min(.05,(now-last)/1000)*speed; last=now;
  if(running) step(dt);
  requestAnimationFrame(loop);
}
document.getElementById('btnRun').addEventListener('click',function(){
  running=!running; this.textContent=running?'Running':'Paused'; this.classList.toggle('on',running);
});
document.getElementById('btnSpd').addEventListener('click',function(){
  speed=speed===1?2:speed===2?4:1; this.textContent=speed+'\u00D7';
});

buildRoster(); select('content');
log('Command','seven agents online. the board is live.',true);
if(reduce){ running=false; document.getElementById('btnRun').textContent='Paused'; step(.01); }
requestAnimationFrame(loop);
})();
</script>
</body>
