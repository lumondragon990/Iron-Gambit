<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iron Gambit Command — 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --obsidian:#0A0908; --line:rgba(216,182,120,.15);
  --gold:#D8B678; --gold-hi:#F0DAA8; --gold-dp:#9C7C43; --smoke:#8B8078; --cream:#F2EBDD;
  --serif:'Cormorant Garamond',Georgia,serif; --sans:'Jost',system-ui,sans-serif; --mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--obsidian);color:var(--cream);font-family:var(--sans);font-weight:300;overflow:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:none}
:focus-visible{outline:1px solid var(--gold);outline-offset:2px}

.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 16px;height:56px;
  border-bottom:1px solid var(--line);background:rgba(10,9,8,.94);position:relative;z-index:30;flex:none}
.logo{display:flex;align-items:center;gap:9px}
.logo svg{width:24px;height:24px;color:var(--gold)}
.logo b{font-family:var(--serif);font-weight:600;font-size:14px;letter-spacing:.18em;text-transform:uppercase}
.logo em{font-style:normal;font-size:8px;letter-spacing:.26em;color:var(--gold-dp);text-transform:uppercase;display:block}
.bar-r{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:9.5px;letter-spacing:.07em;color:var(--smoke)}
.chip{border:1px solid var(--line);padding:6px 9px;transition:all .22s;white-space:nowrap}
.chip:hover{border-color:var(--gold-dp);color:var(--gold)}
.chip.on{border-color:var(--gold);color:var(--gold)}
.live{display:flex;align-items:center;gap:6px;color:var(--gold)}
.pip{width:6px;height:6px;border-radius:50%;background:#6FBF73;animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.3}}
@media(max-width:820px){.logo em{display:none}.bar{padding:0 9px}.chip{padding:5px 6px;font-size:8.5px}}

.app{display:flex;height:calc(100% - 56px)}
.side{width:224px;flex:none;border-right:1px solid var(--line);padding:14px;overflow-y:auto;background:var(--obsidian)}
.side.r{border-right:none;border-left:1px solid var(--line);width:244px}
.mid{flex:1;position:relative;min-width:0;display:flex;flex-direction:column}
#cv{flex:1;position:relative;overflow:hidden;background:#070A0E;cursor:grab}
#cv.drag{cursor:grabbing}
#cv canvas{display:block;width:100%;height:100%}
@media(max-width:1080px){.side{display:none}}

.h{font-size:8.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold-dp);margin-bottom:12px}
.ag{display:flex;align-items:center;gap:9px;padding:8px 7px;border:1px solid transparent;margin-bottom:2px;
  cursor:pointer;transition:all .2s;text-align:left;width:100%}
.ag:hover{background:rgba(216,182,120,.05);border-color:var(--line)}
.ag.sel{background:rgba(216,182,120,.09);border-color:var(--gold-dp)}
.av{width:9px;height:9px;flex:none;border-radius:50%}
.ag-t{flex:1;min-width:0}
.ag-n{font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ag-z{font-family:var(--mono);font-size:7.5px;color:var(--smoke);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ag-d{width:5px;height:5px;border-radius:50%;flex:none}
.d-work{background:#6FBF73}.d-move{background:var(--gold)}.d-in{background:#7AA7D8}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);margin-top:18px}
.st{background:var(--obsidian);padding:10px 9px}
.st b{font-family:var(--serif);font-size:21px;font-weight:500;color:var(--gold);display:block;line-height:1}
.st span{font-size:7.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--smoke);margin-top:4px;display:block}

.zbtn{display:block;width:100%;text-align:left;font-size:11px;padding:8px 9px;border:1px solid var(--line);
  margin-bottom:4px;transition:all .2s;color:var(--smoke)}
.zbtn:hover{border-color:var(--gold);color:var(--gold-hi);background:rgba(216,182,120,.06)}
.zbtn b{display:block;font-weight:400;color:var(--cream);font-size:12px}
.zbtn:hover b{color:var(--gold-hi)}

.det-n{font-family:var(--serif);font-size:20px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.det-r{font-size:10.5px;color:var(--smoke);line-height:1.65;margin-top:9px}
.det-k{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9px;padding:7px 0;
  border-bottom:1px solid var(--line)}
.det-k span:first-child{color:var(--smoke)}.det-k span:last-child{color:var(--gold)}

.log{height:150px;flex:none;border-top:1px solid var(--line);background:var(--obsidian);padding:10px 16px;overflow-y:auto}
.log::-webkit-scrollbar{width:4px}.log::-webkit-scrollbar-thumb{background:var(--gold-dp)}
.ln{font-family:var(--mono);font-size:9.5px;padding:2px 0;display:flex;gap:9px;animation:sl .4s ease;line-height:1.5}
@keyframes sl{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
.ln-t{color:#57514A;flex:none}
.ln-a{color:var(--gold);flex:none;width:112px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ln-m{color:#948C82}.ln.hi .ln-m{color:var(--cream)}

.hud{position:absolute;left:14px;bottom:14px;font-family:var(--mono);font-size:9px;letter-spacing:.1em;
  color:rgba(216,182,120,.5);pointer-events:none;line-height:1.9}
.tip{position:absolute;padding:5px 9px;background:rgba(10,9,8,.94);border:1px solid var(--gold-dp);
  font-family:var(--mono);font-size:9.5px;color:var(--gold-hi);pointer-events:none;opacity:0;transition:opacity .15s;
  transform:translate(-50%,-140%);white-space:nowrap;letter-spacing:.08em;z-index:12}
.tip.on{opacity:1}

.inside{position:absolute;top:14px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:14px;
  background:rgba(10,9,8,.9);border:1px solid var(--gold-dp);padding:9px 14px;opacity:0;pointer-events:none;
  transition:opacity .35s;z-index:14}
.inside.on{opacity:1;pointer-events:auto}
.inside b{font-family:var(--serif);font-size:15px;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
.exit{border:1px solid var(--gold);color:var(--gold);padding:6px 12px;font-family:var(--mono);font-size:9px;
  letter-spacing:.16em;text-transform:uppercase;transition:all .2s}
.exit:hover{background:var(--gold);color:var(--obsidian)}

.boot{position:absolute;inset:0;display:grid;place-items:center;background:#070A0E;z-index:20;text-align:center;
  transition:opacity .6s}
.boot.gone{opacity:0;pointer-events:none}
.boot p{font-family:var(--mono);font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold-dp);margin-top:16px}
.boot svg{width:56px;height:56px;color:var(--gold);animation:brk 2.4s ease-in-out infinite}
@keyframes brk{50%{opacity:.4}}
.err{color:#D98A7A;font-size:12px;max-width:340px;line-height:1.7;font-family:var(--sans)}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<symbol id="crest" viewBox="0 0 120 120">
  <circle cx="60" cy="60" r="43" fill="none" stroke="currentColor" stroke-width="2.6"/>
  <rect x="10" y="57.5" width="100" height="5" fill="currentColor"/>
  <rect x="20" y="47" width="7" height="26" rx="1.4" fill="currentColor"/><rect x="29" y="50" width="6" height="20" rx="1.4" fill="currentColor"/>
  <rect x="93" y="47" width="7" height="26" rx="1.4" fill="currentColor"/><rect x="85" y="50" width="6" height="20" rx="1.4" fill="currentColor"/>
  <rect x="6" y="54" width="5" height="12" rx="1.2" fill="currentColor"/><rect x="109" y="54" width="5" height="12" rx="1.2" fill="currentColor"/>
  <rect x="57.6" y="18" width="4.8" height="15" fill="currentColor"/><rect x="53" y="23" width="14" height="4.6" fill="currentColor"/>
  <path d="M46 40 L49.5 32 L54 38 L60 30 L66 38 L70.5 32 L74 40 Z" fill="currentColor"/>
  <rect x="45" y="40" width="30" height="6" rx="1" fill="currentColor"/>
  <path d="M49 47 C49 62 45 72 43 84 L77 84 C75 72 71 62 71 47 Z" fill="currentColor"/>
  <rect x="39" y="85" width="42" height="7" rx="1.6" fill="currentColor"/><rect x="35" y="93" width="50" height="8" rx="2" fill="currentColor"/>
</symbol>
</svg>

<header class="bar">
  <a href="index.html" class="logo"><svg viewBox="0 0 120 120"><use href="#crest"/></svg>
    <div><b>Iron Gambit</b><em>Command</em></div></a>
  <div class="bar-r">
    <span class="live"><span class="pip"></span><span id="clk">--:--</span></span>
    <button class="chip on" id="btnRun">Running</button>
    <button class="chip" id="btnSpd">1&times;</button>
    <button class="chip" id="btnTime">Auto</button>
    <button class="chip" id="btnFit">Reset view</button>
  </div>
</header>

<div class="app">
  <aside class="side">
    <div class="h">The Crew</div>
    <div id="roster"></div>
    <div class="stats">
      <div class="st"><b id="sActive">0</b><span>Working</span></div>
      <div class="st"><b id="sIn">0</b><span>Indoors</span></div>
      <div class="st"><b id="sTasks">0</b><span>Tasks</span></div>
      <div class="st"><b id="sHand">0</b><span>Handoffs</span></div>
    </div>
  </aside>

  <div class="mid">
    <div id="cv">
      <div class="tip" id="tip"></div>
      <div class="inside" id="insideBar"><b id="insideName">—</b><button class="exit" id="btnExit">Exit building</button></div>
      <div class="hud">
        Drag &mdash; orbit<br>Right-drag / shift-drag &mdash; pan<br>Scroll &mdash; zoom<br>Click a building &mdash; go inside
      </div>
      <div class="boot" id="boot">
        <div><svg viewBox="0 0 120 120"><use href="#crest"/></svg><p id="bootMsg">Building the city</p></div>
      </div>
    </div>
    <div class="log" id="log"></div>
  </div>

  <aside class="side r">
    <div class="h">Dossier</div>
    <div id="detail"></div>
    <div class="h" style="margin-top:22px">Go inside</div>
    <div id="zlist"></div>
  </aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";
var boot=document.getElementById('boot'), bootMsg=document.getElementById('bootMsg');
if(typeof THREE==='undefined'){
  boot.innerHTML='<div class="err">Could not load the 3D engine.<br><br>This page needs three.js from cdnjs.cloudflare.com. '+
    'If you are viewing it inside a restricted preview, download the file and open it in your browser, or deploy it to Vercel.</div>';
  return;
}

/* ============================================================ SETUP */
var host=document.getElementById('cv');
var scene=new THREE.Scene();
scene.background=new THREE.Color(0x0B1018);
scene.fog=new THREE.Fog(0x0B1018,420,900);

var camera=new THREE.PerspectiveCamera(46,1,0.5,2200);
var renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
if(THREE.sRGBEncoding) renderer.outputEncoding=THREE.sRGBEncoding;
host.appendChild(renderer.domElement);

function resize(){
  var w=host.clientWidth, h=host.clientHeight;
  camera.aspect=w/h; camera.updateProjectionMatrix(); renderer.setSize(w,h,false);
}
window.addEventListener('resize',resize);

/* lighting */
var hemi=new THREE.HemisphereLight(0xBFD4E8,0x2A2318,0.55); scene.add(hemi);
var amb=new THREE.AmbientLight(0xffffff,0.22); scene.add(amb);
var sun=new THREE.DirectionalLight(0xFFE6BC,1.5);
sun.position.set(200,300,140);
sun.castShadow=true;
sun.shadow.mapSize.width=2048; sun.shadow.mapSize.height=2048;
sun.shadow.camera.near=10; sun.shadow.camera.far=900;
sun.shadow.camera.left=-340; sun.shadow.camera.right=340;
sun.shadow.camera.top=340; sun.shadow.camera.bottom=-340;
sun.shadow.bias=-0.0008;
scene.add(sun); scene.add(sun.target);

/* ============================================================ MATERIAL HELPERS */
var MAT={};
function mat(color,rough,metal,emis,ei){
  var k=color+'|'+rough+'|'+metal+'|'+(emis||0)+'|'+(ei||0);
  if(!MAT[k]){
    MAT[k]=new THREE.MeshStandardMaterial({color:color,roughness:rough===undefined?.85:rough,
      metalness:metal===undefined?.05:metal, emissive:emis||0x000000, emissiveIntensity:ei||0});
  }
  return MAT[k];
}
var GEO_BOX=new THREE.BoxGeometry(1,1,1);
function box(w,h,d,m,x,y,z,ry,parent,noShadow){
  var mesh=new THREE.Mesh(GEO_BOX,m);
  mesh.scale.set(w,h,d); mesh.position.set(x,y,z);
  if(ry) mesh.rotation.y=ry;
  if(!noShadow){ mesh.castShadow=true; mesh.receiveShadow=true; }
  (parent||scene).add(mesh);
  return mesh;
}
function cyl(rt,rb,h,seg,m,x,y,z,parent){
  var mesh=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg||10),m);
  mesh.position.set(x,y,z); mesh.castShadow=true; mesh.receiveShadow=true;
  (parent||scene).add(mesh); return mesh;
}

/* facade texture with windows */
var FACADE={};
function facade(base,frame,cols,rows,lit){
  var key=base+'_'+frame+'_'+cols+'_'+rows+'_'+lit;
  if(FACADE[key]) return FACADE[key];
  var S=16, c=document.createElement('canvas');
  c.width=cols*S; c.height=rows*S;
  var g=c.getContext('2d');
  g.fillStyle=base; g.fillRect(0,0,c.width,c.height);
  for(var i=0;i<cols;i++) for(var j=0;j<rows;j++){
    var on=((i*7+j*13)%5)!==0;
    g.fillStyle=frame; g.fillRect(i*S+2,j*S+2,S-4,S-4);
    g.fillStyle=on?lit:'#12161A';
    g.globalAlpha=on?1:.75;
    g.fillRect(i*S+3.5,j*S+3.5,S-7,S-7);
    g.globalAlpha=1;
  }
  var t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;
  if(THREE.sRGBEncoding) t.encoding=THREE.sRGBEncoding;
  t.anisotropy=4;
  FACADE[key]=t; return t;
}

/* registries for anything that lights up after dark */
var emissiveWindows=[], lampLights=[], neonMats=[];

/* ============================================================ CITY LAYOUT */
var BLOCK=76, ROAD=22, GRID=5;
var SPAN=GRID*BLOCK+(GRID+1)*ROAD;
var ORIGIN=-SPAN/2;
function bx0(i){ return ORIGIN+ROAD+i*(BLOCK+ROAD); }          /* block min edge */
function bc(i){ return bx0(i)+BLOCK/2; }                       /* block center */
function roadC(i){ return ORIGIN+ROAD/2+i*(BLOCK+ROAD); }      /* road centreline, i=0..GRID */

/* ground */
var ground=new THREE.Mesh(new THREE.PlaneGeometry(1600,1600),mat(0x14180F,1,0));
ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);

/* roads — one strip mesh each, dashes come from a repeating texture */
var roadMat=mat(0x1B1E21,.95,0);
function dashTex(rep){
  var c=document.createElement('canvas'); c.width=8; c.height=64;
  var g=c.getContext('2d');
  g.fillStyle='rgba(0,0,0,0)'; g.fillRect(0,0,8,64);
  g.fillStyle='#D8B678'; g.fillRect(3,10,2,30);
  var t=new THREE.CanvasTexture(c);
  t.wrapS=THREE.RepeatWrapping; t.wrapT=THREE.RepeatWrapping;
  t.repeat.set(1,rep);
  if(THREE.sRGBEncoding) t.encoding=THREE.sRGBEncoding;
  return t;
}
var dtA=dashTex(SPAN/16), dtB=dashTex(SPAN/16);
var lineMatA=new THREE.MeshStandardMaterial({map:dtA,transparent:true,roughness:.7,
  emissiveMap:dtA,emissive:0xffffff,emissiveIntensity:.25});
var lineMatB=new THREE.MeshStandardMaterial({map:dtB,transparent:true,roughness:.7,
  emissiveMap:dtB,emissive:0xffffff,emissiveIntensity:.25});
neonMats.push({m:lineMatA,base:.25,gain:.5},{m:lineMatB,base:.25,gain:.5});
for(var ri=0;ri<=GRID;ri++){
  var rc=roadC(ri);
  box(ROAD,.5,SPAN,roadMat,rc,.26,0,0,scene,true).receiveShadow=true;
  box(SPAN,.5,ROAD,roadMat,0,.25,rc,0,scene,true).receiveShadow=true;
  var la=new THREE.Mesh(new THREE.PlaneGeometry(2.6,SPAN),lineMatA);
  la.rotation.x=-Math.PI/2; la.position.set(rc,.56,0); scene.add(la);
  var lb=new THREE.Mesh(new THREE.PlaneGeometry(2.6,SPAN),lineMatB);
  lb.rotation.x=-Math.PI/2; lb.rotation.z=Math.PI/2; lb.position.set(0,.55,rc); scene.add(lb);
}
/* sidewalks around every block */
var walkMat=mat(0x2A2C28,.95,0);
for(var i2=0;i2<GRID;i2++) for(var j2=0;j2<GRID;j2++){
  box(BLOCK+7,.7,BLOCK+7,walkMat,bc(i2),.35,bc(j2),0,scene,true).receiveShadow=true;
}

/* ============================================================ BUILDINGS */
var ZONES={
  iron:{name:'The Iron House',blk:[0,0],color:0x7A2731,
    blurb:'Twelve thousand square feet of platforms, racks and mirrors. Every campaign frame gets shot here.'},
  office:{name:'The Office',blk:[2,0],color:0x3A3630,
    blurb:'Strategy, copy and launch planning. The war room where drops get built and post-mortems written.'},
  press:{name:'The Press',blk:[4,0],color:0x2E3A44,
    blurb:'Screen printing, foil transfer, embroidery. Every Royal Series piece is finished on this floor.'},
  row:{name:'The Row',blk:[0,2],color:0x8D7A60,
    blurb:'Where the customers actually live. Neighbourhood scouting, stalls, word of mouth.'},
  plaza:{name:'The Plaza',blk:[2,2],color:0x2A2620,
    blurb:'The chessboard. Open ground in the middle of town where everyone crosses paths.'},
  market:{name:'The Market',blk:[4,2],color:0xB9A488,
    blurb:'Blanks, boxes, foil and tape in. Packed orders out. Nothing ships that has not been through here.'},
  whiskey:{name:'Whiskey River',blk:[2,4],color:0x4A1620,
    blurb:'The nightclub. Creators, photographers and gym owners all end up here. Deals get made after midnight.'}
};

var BUILDINGS={};   /* key -> {group,walls[],roof,door,cx,cz,w,d,h,interior} */
var pickables=[];

function makeBuilding(key,opt){
  var b=ZONES[key], cx=bc(b.blk[0]), cz=bc(b.blk[1]);
  var w=opt.w, d=opt.d, h=opt.h, col=b.color;
  var g=new THREE.Group(); g.position.set(cx,0,cz); scene.add(g);

  var hexc='#'+col.toString(16).padStart(6,'0');
  var tex=facade(hexc,shadeHex(hexc,.62),Math.max(3,Math.round(w/7)),Math.max(2,Math.round(h/7)),opt.litColor||'#F0D9A8');
  var texSide=facade(hexc,shadeHex(hexc,.62),Math.max(3,Math.round(d/7)),Math.max(2,Math.round(h/7)),opt.litColor||'#F0D9A8');

  var mFront=new THREE.MeshStandardMaterial({map:tex,roughness:.82,metalness:.06,
    emissiveMap:tex,emissive:0xffffff,emissiveIntensity:0});
  var mSide=new THREE.MeshStandardMaterial({map:texSide,roughness:.82,metalness:.06,
    emissiveMap:texSide,emissive:0xffffff,emissiveIntensity:0});
  emissiveWindows.push(mFront,mSide);
  var mRoof=mat(col,.9,.04);

  var t=.9;   /* wall thickness */
  var walls=[];
  /* front wall (+z) split for a doorway */
  var dw=9;
  walls.push(box((w-dw)/2,h,t,mFront,-(dw+ (w-dw)/2)/2,h/2,d/2,0,g));
  walls.push(box((w-dw)/2,h,t,mFront, (dw+ (w-dw)/2)/2,h/2,d/2,0,g));
  walls.push(box(dw,h-11,t,mFront,0,(h-11)/2+11,d/2,0,g));
  walls.push(box(w,h,t,mFront,0,h/2,-d/2,0,g));
  walls.push(box(t,h,d,mSide,-w/2,h/2,0,0,g));
  walls.push(box(t,h,d,mSide, w/2,h/2,0,0,g));
  var roof=box(w+1.4,1.6,d+1.4,mRoof,0,h+.6,0,0,g);
  walls.push(roof);

  /* parapet */
  var pm=mat(shade(col,1.35),.85,.05);
  box(w+2,2.4,1.2,pm,0,h+2.2,d/2,0,g); box(w+2,2.4,1.2,pm,0,h+2.2,-d/2,0,g);
  box(1.2,2.4,d+2,pm,-w/2,h+2.2,0,0,g); box(1.2,2.4,d+2,pm,w/2,h+2.2,0,0,g);
  walls.push(g.children[g.children.length-1],g.children[g.children.length-2],
             g.children[g.children.length-3],g.children[g.children.length-4]);

  /* rooftop HVAC */
  var hv=mat(0x54595D,.7,.35);
  for(var k=0;k<Math.max(1,Math.floor(w*d/460));k++){
    var ux=(k%3-1)*(w/4), uz=(Math.floor(k/3)%2-.5)*(d/3);
    var u=box(6,4,5,hv,ux,h+3.4,uz,0,g); walls.push(u);
    var fan=cyl(2,2,.8,12,mat(0x33383C,.6,.5),ux,h+5.6,uz,g); walls.push(fan);
  }

  /* awning + entrance step */

  box(dw-1,10,.4,doorGlow,0,5,d/2-.1,0,g);

  walls.forEach(function(m){ m.userData.zone=key; pickables.push(m); });

}
function shade(c,f){
  var r=Math.min(255,Math.round(((c>>16)&255)*f)),g2=Math.min(255,Math.round(((c>>8)&255)*f)),b2=Math.min(255,Math.round((c&255)*f));
  return (r<<16)|(g2<<8)|b2;
}
function shadeHex(hex,f){
  var n=parseInt(hex.slice(1),16);
  return '#'+shade(n,f).toString(16).padStart(6,'0');
}

function makeSign(g,text,w,h,d,color,neon){
  var c=document.createElement('canvas'); c.width=1024; c.height=160;
  var x=c.getContext('2d');
  x.fillStyle='rgba(0,0,0,0)'; x.fillRect(0,0,1024,160);
  x.font='600 84px "Cormorant Garamond", Georgia, serif';
  x.textAlign='center'; x.textBaseline='middle';
  x.letterSpacing='14px';
  x.fillStyle='#'+color.toString(16).padStart(6,'0');
  x.shadowColor=x.fillStyle; x.shadowBlur=neon?34:10;
  x.fillText(text.toUpperCase(),512,84);
  var t=new THREE.CanvasTexture(c);
  if(THREE.sRGBEncoding) t.encoding=THREE.sRGBEncoding;
  var m=new THREE.MeshBasicMaterial({map:t,transparent:true,opacity:neon?1:.92});
  var sw=Math.min(w*.92,58);
  var p=new THREE.Mesh(new THREE.PlaneGeometry(sw,sw*160/1024),m);
  p.position.set(0,h*0.62,d/2+.9); g.add(p);
  neonMats.push({m:m,base:neon?.55:.6,gain:.45,op:true});
}

function nearestRoadX(x){ var best=roadC(0),bd=1e9; for(var i=0;i<=GRID;i++){var c=roadC(i),dd=Math.abs(c-x); if(dd<bd){bd=dd;best=c;}} return best; }
function route(from,to){
  var pts=[];
  var rx=nearestRoadX(from.x), rz=nearestRoadX(to.z);
  pts.push(new THREE.Vector3(rx,0,from.z));
  pts.push(new THREE.Vector3(rx,0,rz));
  pts.push(new THREE.Vector3(to.x,0,rz));
  pts.push(new THREE.Vector3(to.x,0,to.z));
  return pts;
}

var target=new THREE.Vector3(0,10,0);
var sph={th:Math.PI*0.25, ph:Math.PI*0.32, r:430};
function updateCam(){
  sph.ph=Math.max(.12,Math.min(Math.PI*.487,sph.ph));
  sph.r=Math.max(26,Math.min(900,sph.r));
  camera.position.set(
    target.x+sph.r*Math.sin(sph.ph)*Math.sin(sph.th),
    target.y+sph.r*Math.cos(sph.ph),
    target.z+sph.r*Math.sin(sph.ph)*Math.cos(sph.th));
  camera.lookAt(target);
}
var HOME={t:new THREE.Vector3(0,10,0),th:Math.PI*.25,ph:Math.PI*.32,r:430};
var fly=null;
function flyTo(t,th,ph,r,ms){
  fly={t0:performance.now(),ms:ms||1100,
    ft:target.clone(),fth:sph.th,fph:sph.ph,fr:sph.r,
    tt:t.clone(),tth:th,tph:ph,tr:r};
}
function tickFly(){
  if(!fly) return;
  var k=Math.min(1,(performance.now()-fly.t0)/fly.ms);
  var e=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
  target.lerpVectors(fly.ft,fly.tt,e);
  var dth=fly.tth-fly.fth; while(dth>Math.PI)dth-=Math.PI*2; while(dth<-Math.PI)dth+=Math.PI*2;
  sph.th=fly.fth+dth*e; sph.ph=fly.fph+(fly.tph-fly.fph)*e; sph.r=fly.fr+(fly.tr-fly.fr)*e;
  updateCam();
  if(k>=1) fly=null;
}

  var r=host.getBoundingClientRect();

  mouse.y=-((e.clientY-r.top)/r.height)*2+1;
  mouseScreen.x=e.clientX-r.left; mouseScreen.y=e.clientY-r.top;
  if(!dragging) return;
  var dx=e.clientX-lastX, dy=e.clientY-lastY;
  moved+=Math.abs(dx)+Math.abs(dy);
  if(dragging===1){ sph.th-=dx*0.005; sph.ph-=dy*0.005; }
  else{
    var pan=sph.r*0.0016;
    var right=new THREE.Vector3(Math.cos(sph.th),0,-Math.sin(sph.th));
    var fwd=new THREE.Vector3(Math.sin(sph.th),0,Math.cos(sph.th));
    target.addScaledVector(right,-dx*pan); target.addScaledVector(fwd,-dy*pan);
  }
  lastX=e.clientX; lastY=e.clientY; updateCam();
});

function advance(ent,dt){

  if(dist<1.2){
    ent.pi++;
    if(ent.pi>=ent.path.length){ ent.path=[]; return true; }
    return false;
  }
  var step=Math.min(dist,ent.spd*dt);
  ent.pos.x+=dx/dist*step; ent.pos.z+=dz/dist*step;
  ent.p.g.position.x=ent.pos.x; ent.p.g.position.z=ent.pos.z;
  ent.p.g.rotation.y=Math.atan2(dx,dz);
  return false;
}

var sunTarget=new THREE.Vector3(0,0,0);
function step(dt){
  if(autoTime) TOD=(TOD+dt/300)%1;
  document.getElementById('clk').textContent='HOU '+clock();

  /* sun + sky */
  var ang=(TOD-0.25)*Math.PI*2;
  var elev=Math.sin(ang);
  sun.position.set(Math.cos(ang)*360,Math.max(-60,elev*400),160);
  sun.target.position.set(0,0,0); sun.target.updateMatrixWorld();
  var day=Math.max(0,elev);
  var night=1-day;
  sun.intensity=day*1.85;
  sun.color.setHSL(0.09,0.55,0.5+day*0.28);
  hemi.intensity=0.16+day*0.55;
  amb.intensity=0.10+day*0.20;
  var skyDay=new THREE.Color(0x8FB6D6), skyNight=new THREE.Color(0x070A12);
  var sky=skyNight.clone().lerp(skyDay,Math.pow(day,.7));
  scene.background=sky; scene.fog.color=sky;
  emissiveWindows.forEach(function(m){ m.emissiveIntensity=night*0.95; });
  neonMats.forEach(function(o){
    if(o.op) o.m.opacity=Math.min(1,o.base+night*o.gain);
    else o.m.emissiveIntensity=o.base+night*o.gain;
  });
  lampLights.forEach(function(l){ l.intensity=night*1.05; });

  /* agents */
  var indoors=0;
  AGENTS.forEach(function(a){
    a.ph+=dt;
    if(a.state==='travel'){
      var done=advance(a,dt);
      if(done){
        a.state='enter'; a.wait=0.6;
        var rec=BUILDINGS[a.zone];
        if(rec.noEnter){ a.state='work'; a.wait=6+Math.random()*9; a.inside=false; }
      }
      walkAnim(a.p,a.ph,true);
    }
    else if(a.state==='enter'){
      a.wait-=dt;
      if(a.wait<=0){
        var rec2=BUILDINGS[a.zone];
        a.inside=true; a.state='work'; a.wait=8+Math.random()*14;
        a.pos.set(rec2.cx+(Math.random()-.5)*(rec2.w-16),0,rec2.cz+(Math.random()-.5)*(rec2.d-16));
        a.p.g.position.set(a.pos.x,0,a.pos.z);
        a.task=pick(a.tasks); a.done++; tasksToday++;
        log(a.name,'inside '+ZONES[a.zone].name.toLowerCase()+' \u2014 '+a.task,a.id===selected);
      }
      walkAnim(a.p,a.ph,false);
    }
    else { /* work */
      a.wait-=dt;
      if(a.inside && Math.random()<dt*0.55){
        var rc=BUILDINGS[a.zone];
        a.path=[new THREE.Vector3(rc.cx+(Math.random()-.5)*(rc.w-18),0,rc.cz+(Math.random()-.5)*(rc.d-18))];
        a.pi=0;
      }
      if(a.path.length){ advance(a,dt); walkAnim(a.p,a.ph,true); }
      else walkAnim(a.p,a.ph,false);
      if(a.wait<=0){
        var zk=chooseZone(a);
        if(zk===a.zone){
          a.wait=7+Math.random()*10; a.task=pick(a.tasks); a.done++; tasksToday++;
          log(a.name,a.task,a.id===selected);
        }else{
          var rec3=BUILDINGS[a.zone], nxt=BUILDINGS[zk];
          if(a.inside){
            a.pos.set(rec3.door.x,0,rec3.door.z); a.p.g.position.set(a.pos.x,0,a.pos.z);
            a.inside=false;
          }
          a.zone=zk; a.state='travel';
          a.path=route(a.pos,nxt.door); a.pi=0;
          log(a.name,'heading to '+ZONES[zk].name.toLowerCase(),a.id===selected);
        }
      }
    }
    if(a.inside) indoors++;
    var rz=document.getElementById('rz_'+a.id);
    if(rz) rz.textContent=(a.state==='travel'?'\u2192 ':(a.inside?'\u25AA ':''))+ZONES[a.zone].name;
    var rd=document.getElementById('rd_'+a.id);
    if(rd) rd.className='ag-d '+(a.state==='travel'?'d-move':(a.inside?'d-in':'d-work'));
  });

  /* npcs */
  NPCS.forEach(function(n){
    n.ph+=dt;
    if(advance(n,dt)) npcTarget(n);
    walkAnim(n.p,n.ph,true);
  });

  /* cars */
  CARS.forEach(function(c){
    c.p+=c.dir*c.spd*dt;
    if(c.p>SPAN/2+40) c.p=-SPAN/2-40;
    if(c.p<-SPAN/2-40) c.p=SPAN/2+40;
    if(c.axis==='x'){ c.g.position.set(c.p,0,c.lane); c.g.rotation.y=c.dir>0?Math.PI/2:-Math.PI/2; }
    else{ c.g.position.set(c.lane,0,c.p); c.g.rotation.y=c.dir>0?0:Math.PI; }
  });

  /* club lights */
  var wr=BUILDINGS.whiskey.interior;
  if(wr&&wr.visible&&wr.userData.tiles){
    var t=performance.now()*0.001;
    wr.userData.tiles.forEach(function(m,i){
      m.emissiveIntensity=0.35+Math.abs(Math.sin(t*2.4+i*0.55))*1.5;
    });
    if(wr.userData.lights){
      wr.userData.lights[0].position.x=Math.sin(t*1.1)*14;
      wr.userData.lights[1].position.z=Math.cos(t*0.9)*12;
    }
  }

  /* handoffs */
  for(var i=0;i<AGENTS.length;i++) for(var j=i+1;j<AGENTS.length;j++){
    var p1=AGENTS[i],q1=AGENTS[j];
    if(p1.zone===q1.zone && p1.state==='work' && q1.state==='work' && Math.random()<dt*0.045){
      handoffs++;
      log(p1.name+' \u2194 '+q1.name.split(' ')[0],pick(['handoff at '+ZONES[p1.zone].name.toLowerCase(),
        'reviewing the same asset','flagged for a second read','agreed: push it to Friday','swapping notes on Drop 01']),true);
    }
  }

  document.getElementById('sActive').textContent=AGENTS.filter(function(a){return a.state==='work';}).length;
  document.getElementById('sIn').textContent=indoors;
  document.getElementById('sTasks').textContent=tasksToday;
  document.getElementById('sHand').textContent=handoffs;
  var s=AGENTS.filter(function(x){return x.id===selected;})[0];
  if(s){
    var dl=document.getElementById('dLoc'),ds=document.getElementById('dSt'),dd=document.getElementById('dDn');
    if(dl)dl.textContent=ZONES[s.zone].name;
    if(ds)ds.textContent=(s.state==='travel'?'In transit':(s.inside?'Inside':'On site'));
    if(dd)dd.textContent=s.done;
  }
}

function loop(now){
  var dt=Math.min(.05,(now-last)/1000)*speed; last=now;
  if(running) step(dt);
  tickFly(); hover();
  renderer.render(scene,camera);
  requestAnimationFrame(loop);
}

document.getElementById('btnRun').addEventListener('click',function(){
  running=!running; this.textContent=running?'Running':'Paused'; this.classList.toggle('on',running);
});
document.getElementById('btnSpd').addEventListener('click',function(){
  speed=speed===1?2:speed===2?4:1; this.textContent=speed+'\u00D7';
});
document.getElementById('btnTime').addEventListener('click',function(){
  if(autoTime){ autoTime=false; TOD=0.86; this.textContent='Night'; this.classList.add('on'); }
  else if(TOD>0.5){ TOD=0.34; this.textContent='Day'; }
  else { autoTime=true; this.textContent='Auto'; this.classList.remove('on'); }
});
document.getElementById('btnFit').addEventListener('click',function(){
  exitBuilding(true); flyTo(HOME.t,HOME.th,HOME.ph,HOME.r,1000);
});

buildRoster(); select('content');
log('Command','city online. seven agents on the board.',true);
resize(); updateCam();
setTimeout(function(){ boot.classList.add('gone'); },500);
requestAnimationFrame(loop);
})();
</script>
</body>
